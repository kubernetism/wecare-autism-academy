# Local development database only. Production and previews use Neon Postgres.
# Start: npm run db:up   Stop: npm run db:down
services:
  db:
    image: postgres:17-alpine
    container_name: wecare-db
    environment:
      POSTGRES_USER: wecare
      POSTGRES_PASSWORD: wecare
      POSTGRES_DB: wecare
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - wecare-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wecare -d wecare"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  wecare-db-data:
